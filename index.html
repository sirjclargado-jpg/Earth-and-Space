/* =====================================================
   QUIZ ENGINE (DO NOT EDIT)
   ===================================================== */

let currentTopic = "";
let questions = [];
let current = 0;
let score = 0;
let selected = null;

function showTopicMenu() {
  const app = document.getElementById("app");
  app.innerHTML = "<h1>🌍 Earth & Space Science Review</h1><h2>Select a Topic</h2>";
  for (let topic in quiz) {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = topic;
    btn.onclick = () => startTopic(topic);
    app.appendChild(btn);
  }
}

function startTopic(topic) {
  currentTopic = topic;
  questions = quiz[topic];
  current = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion() {
  selected = null;
  const q = questions[current];

  const app = document.getElementById("app");
  app.innerHTML = `
    <h2>${currentTopic}</h2>
    <p>Question ${current + 1} / ${questions.length} | Score: ${score}</p>
    <p><strong>${q.q}</strong></p>
    <div id="choices"></div>
    <button class="btn" onclick="nextQuestion()">Next</button>
  `;

  const choicesDiv = document.getElementById("choices");

  q.c.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = choice;

    btn.onclick = () => {
      if (selected !== null) return;
      selected = index;

      const buttons = document.querySelectorAll("#choices button");
      buttons.forEach((b, i) => {
        b.disabled = true;
        b.classList.add("disabled");
        if (i === q.a) b.classList.add("correct");
      });

      if (index === q.a) {
        score++;
      } else {
        btn.classList.add("wrong");
      }
    };

    choicesDiv.appendChild(btn);
  });
}

function nextQuestion() {
  if (selected === null) {
    alert("Please select an answer.");
    return;
  }
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    document.getElementById("app").innerHTML = `
      <h2>${currentTopic}</h2>
      <h1>🎉 Topic Complete</h1>
      <p>Your Score: <strong>${score} / ${questions.length}</strong></p>
      <button class="btn" onclick="showTopicMenu()">Back to Topics</button>
    `;
  }
}
