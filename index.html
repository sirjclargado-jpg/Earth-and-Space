<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth Science Quiz Game</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
  }
  .container {
    max-width: 750px;
    margin: auto;
    padding: 20px;
  }
  h1, h2 {
    text-align: center;
  }
  .btn {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    font-size: 1em;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn:hover {
    background: #334155;
    color: white;
  }
  .correct {
    background: #16a34a !important;
  }
  .wrong {
    background: #dc2626 !important;
  }
  .disabled {
    background: #1e293b;
    color: #94a3b8;
    cursor: not-allowed;
  }
</style>
</head>

<body>
<div class="container" id="app"></div>

<script>
/* ===============================
   TOPIC-BASED QUESTION BANK
   =============================== */

const quiz = {
  "Earth’s Interior & Plate Tectonics (1–35)": [
    // 🔹 PASTE ITEMS 1–35 HERE
    // { q: "...", c: ["A","B","C","D"], a: 0 },
  ],

  "Volcanoes & Earthquakes (36–70)": [
    // 🔹 PASTE ITEMS 36–70 HERE
  ],

  "Atmosphere & Climate (71–105)": [
    // 🔹 PASTE ITEMS 71–105 HERE
  ],

  "Hazards, DRRM & Sustainability (106–140)": [
    // 🔹 PASTE ITEMS 106–140 HERE
  ]
};

let currentTopic = "";
let questions = [];
let current = 0;
let score = 0;
let selected = null;

/* ===============================
   SCREENS
   =============================== */

function showTopicMenu() {
  const app = document.getElementById("app");
  app.innerHTML = "<h1>🌍 Earth Science Quiz</h1><h2>Select a Topic</h2>";

  for (let topic in quiz) {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = topic;
    btn.onclick = () => startTopic(topic);
    app.appendChild(btn);
  }
}

function startTopic(topic) {
  currentTopic = topic;
  questions = quiz[topic];
  current = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion() {
  selected = null;
  const q = questions[current];

  const app = document.getElementById("app");
  app.innerHTML = `
    <h2>${currentTopic}</h2>
    <p>Question ${current + 1} / ${questions.length} | Score: ${score}</p>
    <p><strong>${q.q}</strong></p>
    <div id="choices"></div>
    <button class="btn" onclick="nextQuestion()">Next</button>
  `;

  const choicesDiv = document.getElementById("choices");

  q.c.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = choice;

    btn.onclick = () => {
      if (selected !== null) return;
      selected = index;

      const buttons = document.querySelectorAll("#choices button");
      buttons.forEach((b, i) => {
        b.disabled = true;
        b.classList.add("disabled");
        if (i === q.a) b.classList.add("correct");
      });

      if (index === q.a) {
        score++;
      } else {
        btn.classList.add("wrong");
      }
    };

    choicesDiv.appendChild(btn);
  });
}

function nextQuestion() {
  if (selected === null) {
    alert("Please select an answer.");
    return;
  }

  current++;

  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <h2>${currentTopic}</h2>
    <h1>🎉 Topic Complete!</h1>
    <p>Your Score: <strong>${score} / ${questions.length}</strong></p>
    <button class="btn" onclick="showTopicMenu()">Back to Topics</button>
  `;
}

/* ===============================
   START APP
   =============================== */
showTopicMenu();
</script>

</body>
</html>
