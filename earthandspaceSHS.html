<!DOCTYPE html>

<head>

<style>

{q:"Climate refers to?",c:["Daily conditions","Long-term patterns","Storms","Winds"],a:1},

{q:"Why do coastal areas have mild climates?",c:["High altitude","Ocean moderates temperature","Less sunlight","More wind"],a:1},
{q:"Which layer has the highest temperature?",c:["Troposphere","Stratosphere","Mesosphere","Thermosphere"],a:3},
{q:"Which atmospheric layer is the coldest?",c:["Troposphere","Stratosphere","Mesosphere","Thermosphere"],a:2},

{q:"What causes auroras?",c:["Volcanoes","Solar wind","Moonlight","Clouds"],a:1},

/* 81–100 Final Set (Verified) */
{q:"Which method is used to determine the absolute age of rocks?",c:["Relative dating","Stratigraphy","Radiometric dating","Layer position"],a:2},

{q:"Which condition makes Earth suitable for life?",c:["Large size only","Presence of liquid water","Fast rotation","Many moons"],a:1},
{q:"Which plate boundary produces the deepest ocean trenches?",c:["Divergent","Transform","Convergent","Passive"],a:2},
{q:"Why do planets closer to the Sun have shorter orbital periods?",c:["They rotate faster","They experience stronger solar gravity","They are smaller","They have fewer moons"],a:1},
{q:"Which atmospheric layer absorbs most ultraviolet radiation?",c:["Troposphere","Stratosphere","Mesosphere","Thermosphere"],a:1},
{q:"What is the primary role of the ozone layer?",c:["Trap heat","Produce oxygen","Absorb UV radiation","Control winds"],a:2},

{q:"Why does the Moon have almost no atmosphere?",c:["It is too far from Earth","Its gravity is too weak","It has no rotation","It is too cold"],a:1},

{q:"Why is summer warmer than winter in one hemisphere?",c:["Earth is closer to the Sun","Higher Sun angle and longer daylight","Faster Earth rotation","Moon position"],a:1},
{q:"Which type of stress causes rocks to slide past each other?",c:["Compression","Tension","Shearing","Expansion"],a:2},
{q:"What process turns lava into solid igneous rock?",c:["Weathering","Cooling","Deposition","Erosion"],a:1},
{q:"What mainly causes ocean tides on Earth?",c:["Wind","Earth’s rotation","Moon’s gravity","Sunlight"],a:2},
{q:"Which principle states that present processes explain the past?",c:["Catastrophism","Uniformitarianism","Volcanism","Impact theory"],a:1}  
];

/* 🔒 SAFETY LOCK */
if (quiz.length !== 100) {
  alert("ERROR: Quiz must have exactly 100 questions. Current count: " + quiz.length);
}

/* ===================== QUIZ LOGIC ===================== */
function loadQuestion() {
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("progress").innerText =
    `Question ${index + 1} / ${quiz.length} | Score: ${score}`;
  document.getElementById("question").innerText = quiz[index].q;

  let html = "";
  quiz[index].c.forEach((choice, i) => {
    html += `<button onclick="checkAnswer(${i})">${choice}</button>`;
  });
  document.getElementById("choices").innerHTML = html;
}

function checkAnswer(choice) {
  const correct = quiz[index].a;
  const isCorrect = choice === correct;

  responses.push({
    question: quiz[index].q,
    selected: quiz[index].c[choice],
    correct: quiz[index].c[correct],
    result: isCorrect ? "Correct" : "Wrong"
  });

  if (isCorrect) score++;

  document.getElementById("feedback").innerHTML = `
    <div class="${isCorrect ? 'correct' : 'wrong'}">
      ${isCorrect ? "Correct!" : "Wrong!"}
    </div>
    <div class="answer">Correct Answer: <b>${quiz[index].c[correct]}</b></div>
  `;

  index++;
  if (index < quiz.length) setTimeout(loadQuestion, 1500);
  else finishQuiz();
}

function finishQuiz() {
  const percent = Math.round((score / quiz.length) * 100);
  document.getElementById("quizBox").innerHTML = `
    <h2>🎉 Quiz Completed</h2>
    <p>Score: ${score} / ${quiz.length}</p>
    <p>Percentage: ${percent}%</p>
    <button onclick="downloadCSV()">📥 Download Results</button>
  `;
}

function downloadCSV() {
  let csv = "Question,Your Answer,Correct Answer,Result\n";
  responses.forEach(r => {
    csv += `"${r.question}","${r.selected}","${r.correct}","${r.result}"\n`;
  });
  csv += `\nFinal Score,${score}/${quiz.length}\nPercentage,${Math.round((score/quiz.length)*100)}%\n`;

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Earth_Space_Science_Quiz_100_Items.csv";
  a.click();
  URL.revokeObjectURL(url);
}

loadQuestion();
</script>

</body>
</html>
